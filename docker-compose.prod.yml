# Production on the Raspberry Pi (dhpk-pi), served publicly at glint.dheepstack.com through
# Cloudflare Tunnel. Bound to localhost only: cloudflared is the sole way in.
services:
  glint:
    build: .
    container_name: glint
    restart: always
    ports:
      - "127.0.0.1:8082:3000"
    volumes:
      # Lives outside the runner's checkout so deploys never touch photos or the database.
      - /home/dhpk/apps/glint/data:/app/data
    env_file:
      - .env.production
